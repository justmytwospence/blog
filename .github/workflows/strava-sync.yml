name: strava-sync

# Triggered by the webhook route (repository_dispatch) when a Strava activity
# lands, or manually via the Actions UI. Refreshes the committed totals and
# pushes them back to main so Vercel redeploys.
on:
  repository_dispatch:
    types: [strava-activity]
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize bursts (one upload/edit can emit several webhooks). Never cancel an
# in-flight sync mid-push.
concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh totals
        run: npm run totals:refresh
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      # Token-rotation hazard: refreshIndex may rotate the Strava refresh token
      # and write it to .strava-token.json. That file is gitignored and does NOT
      # survive this ephemeral runner, so the *next* run would fail auth unless we
      # push the rotated token back into the Actions secret. Requires a PAT with
      # Actions secrets:write (STRAVA_TOKEN_ROTATE_PAT); if absent, warn but don't fail.
      - name: Propagate rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.STRAVA_TOKEN_ROTATE_PAT }}
        run: |
          if [ ! -f .strava-token.json ]; then
            echo "No token rotation this run (.strava-token.json absent); nothing to propagate."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Strava refresh token rotated but STRAVA_TOKEN_ROTATE_PAT is not set."
            echo "::warning::Update the STRAVA_REFRESH_TOKEN Actions secret manually or the next run will fail auth."
            exit 0
          fi
          NEW_TOKEN=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('.strava-token.json','utf8')).refreshToken || '')")
          if [ -z "$NEW_TOKEN" ]; then
            echo "::warning::.strava-token.json present but has no refreshToken; skipping."
            exit 0
          fi
          printf '%s' "$NEW_TOKEN" | gh secret set STRAVA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" --body -
          echo "Propagated rotated STRAVA_REFRESH_TOKEN to the Actions secret."

      - name: Commit refreshed totals
        run: |
          git config user.name "strava-bot"
          git config user.email "strava-bot@users.noreply.github.com"
          git add data/adventures
          if git diff --staged --quiet; then
            echo "No totals changes to commit."
          else
            git commit -m "chore: strava sync [skip ci]"
            git push
          fi
